<div class="login-screen" id="loginScreen">

  <div class="login-card">

    <div class="system-label">
      <span class="system-dot"></span>
      KALYE LUMA CASHIER SYSTEM
    </div>

    <h1>KALYE LUMA</h1>

    <p class="login-subtitle">
      Sign in to open the register.
    </p>

    <form id="loginForm">

      <label for="loginUser">
        Username
      </label>

      <input
        type="text"
        id="loginUser"
        autocomplete="username"
        required
      >

      <label for="loginPass">
        Password
      </label>

      <div class="password-box">

        <input
          type="password"
          id="loginPass"
          autocomplete="current-password"
          required
        >

        <button
          type="button"
          id="showPasswordBtn"
          class="show-password"
        >
          SHOW
        </button>

      </div>

      <div
        id="loginError"
        class="login-error"
      ></div>

      <button
        type="submit"
        class="login-btn"
      >
        Log in
      </button>

      <button
        type="button"
        id="showSignupBtn"
        class="signup-btn"
      >
        Sign up
      </button>

      <button
        type="button"
        id="showChangePasswordBtn"
        class="change-password-link"
        style="display: none;"
      >
        Change password
      </button>

    </form>

  </div>

</div>
